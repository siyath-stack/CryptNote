<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptNote - Password Protected Personal Diary</title>
  <link rel="stylesheet" href="style.css">
  <!-- jQuery Library -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <!-- Screen 1: Login / Locked View -->
  <div id="login-screen" class="container">
    <div class="lock-icon">🔒</div>
    <h1>CryptNote</h1>
    <p class="subtitle">PRIVATE DIARY</p>

    <div class="form-group">
      <label for="master-password">MASTER PASSWORD</label>
      <input type="password" id="master-password" placeholder="Enter password...">
      <button id="unlock-btn">UNLOCK DIARY</button>
    </div>

    <p id="status-text">Status: <strong>Locked</strong></p>

    <!-- Screen 3: Error Alert Box -->
    <div id="error-alert" class="alert hidden">
      <div class="alert-content">
        <h3>⚠️ Access Denied</h3>
        <p>Incorrect password. Please try again.</p>
        <button id="dismiss-alert-btn">Try Again</button>
      </div>
    </div>
  </div>

  <!-- Screen 2: Unlocked Diary Dashboard -->
  <div id="dashboard-screen" class="container hidden">
    <header class="top-bar">
      <div class="logo-area">
        <span class="lock-icon-small">🔒</span>
        <h2>CryptNote</h2>
      </div>
      <button id="lock-btn">🔒 Lock</button>
    </header>

    <!-- List of past diary entries -->
    <div id="entries-display" class="entries-container">
      <!-- Entries loaded dynamically via client.js -->
    </div>

    <!-- New entry input area -->
    <div class="new-entry-box">
      <label for="entry-text">NEW ENTRY</label>
      <textarea id="entry-text" rows="4" placeholder="Write your thoughts here..."></textarea>
      <div class="action-bar">
        <span class="draft-status">Unsaved draft</span>
        <button id="submit-entry-btn">SUBMIT ENTRY</button>
      </div>
    </div>
  </div>

  <!-- Client-side JavaScript -->
  <script src="client.js"></script>
</body>
</html>
